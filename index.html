<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#244CFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="poda" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>poda — selective retail / market intelligence</title>
  <meta name="description" content="poda identifies what is moving, explains why it matters, and builds a store around its strongest expression. Selective retail / market intelligence. New York + Washington, DC + Los Angeles." />
  <meta property="og:title" content="poda — selective retail / market intelligence" />
  <meta property="og:description" content="poda identifies what is moving, explains why it matters, and builds a store around its strongest expression." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="site-body">
  <header class="site-header" id="siteHeader" data-variant="minimal">
    <div class="site-header__inner"></div>
  </header>

  <main class="home-desktop">
    <section class="home-folders" aria-label="Browse poda">
      <!-- Five folders. Static so every link works without JS; folders.js
           then fills in the live state (current release, past-folder count,
           and the red "new material" dot on Shop and Inbox). -->
      <div class="home-folders__grid" id="homeFolders">
        <a class="folder-tile" href="shop.html" data-folder="shop" data-name="Shop">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Shop</span>
          <span class="folder-tile__state">The current drop</span>
        </a>
        <a class="folder-tile" href="market-notes.html" data-folder="inbox" data-name="Inbox">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Inbox</span>
          <span class="folder-tile__state">Notes &amp; updates</span>
        </a>
        <a class="folder-tile" href="lookbook.html" data-folder="lookbook" data-name="Lookbook">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Lookbook</span>
          <span class="folder-tile__state">Visual studies</span>
        </a>
        <a class="folder-tile" href="archive.html" data-folder="archive" data-name="Archive">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Archive</span>
          <span class="folder-tile__state">Past folders</span>
        </a>
        <a class="folder-tile" href="sell.html" data-folder="sell" data-name="Sell with poda">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Sell with poda</span>
          <span class="folder-tile__state">Apply to sell</span>
        </a>
        <a class="folder-tile" href="source.html" data-folder="source" data-name="Source">
          <span class="folder-art" aria-hidden="true"><img src="assets/folders/poda-folder.svg" alt="" decoding="async" /></span>
          <span class="folder-tile__label">Source</span>
          <span class="folder-tile__state">Find a piece</span>
        </a>
      </div>
      <nav class="home-folders__links" aria-label="More from poda">
        <a href="about.html">About</a>
        <a href="seller.html" data-seller-link>Seller login</a>
      </nav>
    </section>
  </main>

  <footer class="site-footer" data-variant="minimal"></footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="marketplace-db.js"></script>
  <script src="folders.js"></script>
  <script src="layout.js"></script>
</body>
</html>
