<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Poda Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body class="home-body">

      <nav class="home-nav" aria-label="Primary">

        <a href="index.html" class="home-nav__item home-nav__item--active">

          <svg class="home-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">

            <path d="M9 22V12h6v10"/>

            <span class="home-nav__sub">poda capital</span>

        </a>

        <a href="market-notes.html" class="home-nav__item">

          <svg class="home-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">

        <a href="closet.html" class="home-nav__item">

            <span class="home-nav__word">Bin</span>
            <span class="home-nav__sub">closet capital</span>
          </span>
        </a>

        <a href="archive.html" class="home-nav__item">

          <svg class="home-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">

          </span>
        </a>

            <span class="home-nav__sub">unfinished thoughts</span>

            <circle cx="10" cy="18" r="2" fill="var(--home-bg)" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <span class="home-nav__label">
            <span class="home-nav__word">Settings</span>
            <span class="home-nav__sub">preferences</span>
          </span>
