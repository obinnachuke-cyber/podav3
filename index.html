<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#244CFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="poda" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>poda — selective retail / market intelligence</title>
  <meta name="description" content="poda identifies what is moving, explains why it matters, and builds a store around its strongest expression. Selective retail / market intelligence. New York + Washington, DC + Los Angeles." />
  <meta property="og:title" content="poda — selective retail / market intelligence" />
  <meta property="og:description" content="poda identifies what is moving, explains why it matters, and builds a store around its strongest expression." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
  <!-- layout.js waits for this so the header and footer are drawn for the
       view that is chosen below. folders.js resolves it. -->
  <script>window.PODA_LANDING_READY = new Promise(function (resolve) { window.__landingResolve = resolve; });</script>
  <noscript><style>#landingHome { display: block !important; }</style></noscript>
</head>
<body>
  <!-- One address, two views, chosen by folders.js:
         - a release is in Shop  -> the Shop is the homepage
         - nothing is in Shop    -> the folder homepage below
       index.html?view=shop always shows the Shop. -->
  <header class="site-header" id="siteHeader">
    <div class="site-header__inner"></div>
  </header>

  <!-- View 1: folder homepage. Static so every link works without JS;
       folders.js adds the live state (what is in Shop, past-release count,
       and the red "new material" dot on Shop and Inbox). -->
  <main class="home-desktop" id="landingHome" hidden>
    <section class="home-folders" aria-label="Browse poda">
      <!-- The scene is decorative and clickable with a mouse; the index below
           is the real navigation (keyboard, screen readers, phones). Hovering
           either highlights both. folders.js adds live state to the index
           and raises the red stack on a folder with new material. -->
      <div class="fscene" id="folderScene">
        <div class="frow">
        <a class="fstack" data-scene="shop" href="index.html?view=shop" style="--i:0" aria-hidden="true" tabindex="-1">
          <span class="fripple">
            <i class="fc fc--b4"></i><i class="fc fc--b3"></i><i class="fc fc--b2"></i><i class="fc fc--b1"></i>
            <i class="fc fc--r3"></i><i class="fc fc--r2"></i><i class="fc fc--r1"></i>
            <span class="fc fc--front"><b class="ftab">Shop</b></span>
          </span>
        </a>
        <a class="fstack" data-scene="inbox" href="market-notes.html" style="--i:1" aria-hidden="true" tabindex="-1">
          <span class="fripple">
            <i class="fc fc--b4"></i><i class="fc fc--b3"></i><i class="fc fc--b2"></i><i class="fc fc--b1"></i>
            <i class="fc fc--r3"></i><i class="fc fc--r2"></i><i class="fc fc--r1"></i>
            <span class="fc fc--front"><b class="ftab">Inbox</b></span>
          </span>
        </a>
        <a class="fstack" data-scene="lookbook" href="lookbook.html" style="--i:2" aria-hidden="true" tabindex="-1">
          <span class="fripple">
            <i class="fc fc--b4"></i><i class="fc fc--b3"></i><i class="fc fc--b2"></i><i class="fc fc--b1"></i>
            <i class="fc fc--r3"></i><i class="fc fc--r2"></i><i class="fc fc--r1"></i>
            <span class="fc fc--front"><b class="ftab">Lookbook</b></span>
          </span>
        </a>
        <a class="fstack" data-scene="archive" href="archive.html" style="--i:3" aria-hidden="true" tabindex="-1">
          <span class="fripple">
            <i class="fc fc--b4"></i><i class="fc fc--b3"></i><i class="fc fc--b2"></i><i class="fc fc--b1"></i>
            <i class="fc fc--r3"></i><i class="fc fc--r2"></i><i class="fc fc--r1"></i>
            <span class="fc fc--front"><b class="ftab">Archive</b></span>
          </span>
        </a>
        <a class="fstack" data-scene="sell" href="sell.html" style="--i:4" aria-hidden="true" tabindex="-1">
          <span class="fripple">
            <i class="fc fc--b4"></i><i class="fc fc--b3"></i><i class="fc fc--b2"></i><i class="fc fc--b1"></i>
            <i class="fc fc--r3"></i><i class="fc fc--r2"></i><i class="fc fc--r1"></i>
            <span class="fc fc--front"><b class="ftab">Sell</b></span>
          </span>
        </a>
        </div>
      </div>
      <nav class="findex" id="homeFolders" aria-label="Browse poda">
        <a class="findex__item" href="index.html?view=shop" data-folder="shop" data-name="Shop">
          <span class="folder-tile__label">Shop</span>
          <span class="folder-tile__state">The current drop</span>
        </a>
        <a class="findex__item" href="market-notes.html" data-folder="inbox" data-name="Inbox">
          <span class="folder-tile__label">Inbox</span>
          <span class="folder-tile__state">Notes &amp; updates</span>
        </a>
        <a class="findex__item" href="lookbook.html" data-folder="lookbook" data-name="Lookbook">
          <span class="folder-tile__label">Lookbook</span>
          <span class="folder-tile__state">Visual studies</span>
        </a>
        <a class="findex__item" href="archive.html" data-folder="archive" data-name="Archive">
          <span class="folder-tile__label">Archive</span>
          <span class="folder-tile__state">Past folders</span>
        </a>
        <a class="findex__item" href="sell.html" data-folder="sell" data-name="Sell with poda">
          <span class="folder-tile__label">Sell with poda</span>
          <span class="folder-tile__state">Apply to sell</span>
        </a>
      </nav>
      <nav class="home-folders__links" aria-label="More from poda">
        <a href="about.html">About</a>
        <a href="seller.html" data-seller-link>Seller login</a>
        <a href="admin.html">Admin</a>
      </nav>
    </section>
  </main>

  <!-- View 3: the release being built, shown while nothing is in Shop. Filled
       in by folders.js; its products stay locked until the drop opens. -->
  <main class="portal-shell" id="landingBuilding" hidden>
    <div id="buildingPage" aria-live="polite">
      <p class="status-message">Opening folder…</p>
    </div>
  </main>

  <!-- View 2: the Shop. Filled in by folders.js; products come from the
       database only. -->
  <main class="portal-shell" id="landingShop" hidden>
    <div id="shopPage" aria-live="polite">
      <p class="status-message">Opening Shop…</p>
    </div>
  </main>

  <footer class="site-footer portal-shell" id="siteFooter"></footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="marketplace-db.js"></script>
  <script src="tz.js"></script>
  <script src="folders.js"></script>
  <script src="subscribe.js"></script>
  <script src="layout.js"></script>
</body>
</html>
