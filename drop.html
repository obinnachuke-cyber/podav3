<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Edit — poda</title>
  <meta name="description" content="The Edit is poda's current drop — a narrow, deliberate selection of pieces chosen around one thesis." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="site-header__inner"></div>
  </header>

  <main class="portal-shell">
    <section class="page-section" style="border-bottom:none;">

      <div class="purple-band">
        <header id="dropHeader" class="drop-hero purple-band__inner">
          <span class="drop-hero__eyebrow">The Edit</span>
          <h1 class="drop-hero__title">Loading the edit…</h1>
        </header>
      </div>

      <div id="dropControls"></div>
      <section id="dropEmpty" class="status-message"></section>
      <section id="dropGrid" class="items-grid" aria-live="polite"></section>

    </section>
  </main>

  <footer class="site-footer portal-shell">
    <div class="footer-left">
      <span class="footer-brand">poda</span>
      <a class="footer-admin" href="admin.html">Admin</a>
    </div>
    <nav class="footer-links" aria-label="Social">
      <a class="footer-icon" href="https://instagram.com/podacapital" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="footer-icon" href="https://x.com/podacap" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.2 10.8 19.5 4h-1.5l-5.5 5.9L8.4 4H4l6.6 7.7L4 20h1.5l5.8-6.3 4.6 6.3H20l-6.8-9.2z"/>
        </svg>
      </a>
    </nav>
  </footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="script.js"></script>
  <script src="subscribe.js"></script>
  <script src="layout.js"></script>
</body>
</html>
