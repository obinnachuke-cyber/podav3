<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inbox — Poda Capital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- Sidebar (desktop only) -->
    <nav class="app-sidebar" id="appSidebar" aria-label="Site navigation">
      <a class="app-sidebar__brand" href="index.html">Poda Capital</a>
      <div class="app-sidebar__nav">
        <a href="index.html"          class="app-sidebar__link">Home</a>
        <a href="market-notes.html"   class="app-sidebar__link app-sidebar__link--active">Inbox</a>
        <a href="closet.html"         class="app-sidebar__link">Bin</a>
        <a href="archive.html"        class="app-sidebar__link">Archive</a>
        <a href="drafts.html"         class="app-sidebar__link">Drafts</a>
        <a href="about.html"          class="app-sidebar__link">About</a>
        <div class="app-sidebar__divider"></div>
        <a href="admin.html"          class="app-sidebar__link">Admin</a>
        <a href="settings.html"       class="app-sidebar__link">Settings</a>
      </div>
    </nav>

    <!-- Content panel -->
    <div class="app-content">

      <!-- Topbar -->
      <div class="app-topbar">
        <button class="app-topbar__toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <line x1="1" y1="1" x2="15" y2="1"/>
            <line x1="1" y1="7" x2="15" y2="7"/>
            <line x1="1" y1="13" x2="15" y2="13"/>
          </svg>
        </button>
        <span class="app-topbar__title">Inbox</span>
        <a class="app-topbar__home" href="index.html">← Home</a>
      </div>

      <main class="portal-shell">
        <section id="market-notes" class="page-section">

          <!-- Inbox header bar -->
          <div class="inbox-header">
            <span class="inbox-header__from">From</span>
            <span class="inbox-header__subject">Subject</span>
            <span class="inbox-header__date">Date</span>
          </div>

          <!-- Rows injected by JS -->
          <div id="inboxList" class="inbox-list">
            <p id="marketNotesEmpty" class="status-message">Loading...</p>
          </div>

        </section>
      </main>

      <footer class="site-footer portal-shell">
        <div class="footer-left">
          <span class="footer-brand">Poda Capital</span>
          <a class="footer-admin" href="admin.html">Admin</a>
        </div>
        <nav class="footer-links" aria-label="Social">
          <a class="footer-icon" href="https://instagram.com/podacapital" target="_blank" rel="noopener" aria-label="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </a>
          <a class="footer-icon" href="https://x.com/podacap" target="_blank" rel="noopener" aria-label="X (Twitter)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.2 10.8 19.5 4h-1.5l-5.5 5.9L8.4 4H4l6.6 7.7L4 20h1.5l5.8-6.3 4.6 6.3H20l-6.8-9.2z"/>
            </svg>
          </a>
        </nav>
      </footer>

    </div><!-- /.app-content -->
  </div><!-- /.app-shell -->

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="script.js"></script>
  <script src="shell.js"></script>
</body>
</html>
