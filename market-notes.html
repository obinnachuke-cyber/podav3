<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Market Notes — Poda Capital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">Poda Capital</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="market-notes.html">Market Notes</a>
      <a href="closet.html">Closet Capital</a>
      <a href="about.html">About</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="portal-shell">
    <section id="market-notes" class="page-section market-notes">
      <div class="section-bar">
        <span class="section-bar__label">Newsletter</span>
        <span class="section-bar__title">Market Notes</span>
      </div>

      <div class="market-notes__body">
        <p id="marketNotesEmpty" class="status-message hidden">Market notes coming soon.</p>
        <article class="note-feature" data-note-slot="primary" hidden>
          <h3 class="note-feature__title"></h3>
          <p class="note-feature__preview"></p>
          <a class="note-link" href="#">Read the note</a>
        </article>

        <div class="note-rail">
          <article class="note-teaser" data-note-slot="secondary" hidden>
            <h3 class="note-teaser__title"></h3>
            <a class="note-link" href="#">Read the note</a>
          </article>
          <article class="note-teaser" data-note-slot="tertiary" hidden>
            <h3 class="note-teaser__title"></h3>
            <a class="note-link" href="#">Read the note</a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer portal-shell">
    <span class="footer-brand">Poda Capital</span>
    <nav class="footer-links" aria-label="Social">
      <a class="footer-icon" href="https://instagram.com/podacapital" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="footer-icon" href="https://x.com/podacap" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.2 10.8 19.5 4h-1.5l-5.5 5.9L8.4 4H4l6.6 7.7L4 20h1.5l5.8-6.3 4.6 6.3H20l-6.8-9.2z"/>
        </svg>
      </a>
    </nav>
  </footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="script.js"></script>
</body>
</html>
