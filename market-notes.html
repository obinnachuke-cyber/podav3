<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inbox — poda</title>
  <meta name="description" content="The Inbox is poda's research layer — the reasoning behind each selection. What is moving, why it matters, and what it means for the store." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="site-header__inner"></div>
  </header>

  <main class="portal-shell">
    <section id="market-notes" class="page-section">

      <div class="section-bar">
        <span class="section-bar__label">Research</span>
        <span class="section-bar__title">Inbox</span>
      </div>
      <p class="about__text" style="margin:0 0 14px;max-width:60ch;">The reasoning behind the store — what's moving, and why it matters.</p>

      <!-- BUY / SELL / WATCH filter -->
      <div class="controls" role="tablist" aria-label="Note categories">
        <div class="toggle-group">
          <button type="button" class="toggle active" data-note-filter="all">All</button>
          <button type="button" class="toggle" data-note-filter="buy">Buy</button>
          <button type="button" class="toggle" data-note-filter="sell">Sell</button>
          <button type="button" class="toggle" data-note-filter="watch">Watch</button>
        </div>
      </div>

      <!-- Inbox header bar -->
      <div class="inbox-header">
        <span class="inbox-header__from">From</span>
        <span class="inbox-header__subject">Subject</span>
        <span class="inbox-header__date">Date</span>
      </div>

      <!-- Rows injected by JS -->
      <div id="inboxList" class="inbox-list">
        <p id="marketNotesEmpty" class="status-message">Loading...</p>
      </div>

    </section>
  </main>

  <footer class="site-footer portal-shell">
    <div class="footer-left">
      <span class="footer-brand">poda</span>
      <a class="footer-admin" href="admin.html">Admin</a>
    </div>
    <nav class="footer-links" aria-label="Social">
      <a class="footer-icon" href="https://instagram.com/podacapital" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="footer-icon" href="https://x.com/podacap" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.2 10.8 19.5 4h-1.5l-5.5 5.9L8.4 4H4l6.6 7.7L4 20h1.5l5.8-6.3 4.6 6.3H20l-6.8-9.2z"/>
        </svg>
      </a>
    </nav>
  </footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="script.js"></script>
  <script src="subscribe.js"></script>
  <script src="layout.js"></script>
</body>
</html>
