<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Market Note — Poda Capital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- Sidebar (desktop only) -->
    <nav class="app-sidebar" id="appSidebar" aria-label="Site navigation">
      <a class="app-sidebar__brand" href="index.html">Poda Capital</a>
      <div class="app-sidebar__nav">
        <a href="index.html"          class="app-sidebar__link">Home</a>
        <a href="market-notes.html"   class="app-sidebar__link app-sidebar__link--active">Inbox</a>
        <a href="closet.html"         class="app-sidebar__link">Bin</a>
        <a href="archive.html"        class="app-sidebar__link">Archive</a>
        <a href="drafts.html"         class="app-sidebar__link">Drafts</a>
        <a href="about.html"          class="app-sidebar__link">About</a>
        <div class="app-sidebar__divider"></div>
        <a href="admin.html"          class="app-sidebar__link">Admin</a>
        <a href="settings.html"       class="app-sidebar__link">Settings</a>
      </div>
    </nav>

    <!-- Content panel -->
    <div class="app-content">

      <!-- Topbar -->
      <div class="app-topbar">
        <button class="app-topbar__toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <line x1="1" y1="1" x2="15" y2="1"/>
            <line x1="1" y1="7" x2="15" y2="7"/>
            <line x1="1" y1="13" x2="15" y2="13"/>
          </svg>
        </button>
        <span class="app-topbar__title" id="topbarTitle">Note</span>
        <a class="app-topbar__home" href="market-notes.html">← Inbox</a>
      </div>

      <main class="portal-shell">
        <div class="note-page" id="notePage">
          <p class="status-message" id="noteStatus">Loading…</p>
        </div>
      </main>

      <footer class="site-footer portal-shell">
        <div class="footer-left">
          <span class="footer-brand">Poda Capital</span>
        </div>
      </footer>

    </div><!-- /.app-content -->
  </div><!-- /.app-shell -->

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script>
    (async function () {
      const page   = document.getElementById("notePage");
      const status = document.getElementById("noteStatus");
      const topbar = document.getElementById("topbarTitle");

      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) { status.textContent = "Note not found."; return; }

      let notes = [];
      try { notes = await window.PodaDB.getNotes(); } catch (e) { /* offline */ }

      const note = notes.find(n => n.id === id);

      if (!note || note.status !== "published") {
        status.textContent = "Note not found.";
        return;
      }

      // Update page title
      document.title = `${note.title} — Poda Capital`;
      if (topbar) topbar.textContent = note.title;

      // Format date
      const dateStr = note.publishedAt
        ? new Date(note.publishedAt).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
        : "";

      function escHTML(s) {
        return String(s || "")
          .replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      // Render body: split on blank lines → blocks.
      // A block that matches [img: url] becomes a figure; everything else is a paragraph.
      const IMG_TAG = /^\[img:\s*(https?:\/\/[^\]]+)\]$/i;

      const bodyHTML = String(note.body || "")
        .split(/\n\s*\n/)
        .map(block => block.trim())
        .filter(Boolean)
        .map(block => {
          const lines = block.split("\n").map(l => l.trim());
          if (lines.length === 1 && IMG_TAG.test(lines[0])) {
            const url = lines[0].match(IMG_TAG)[1];
            return `<figure class="note-article__figure"><img src="${escHTML(url)}" alt="" loading="lazy" /></figure>`;
          }
          const inner = lines.map(line => {
            const m = line.match(IMG_TAG);
            if (m) return `</p><figure class="note-article__figure"><img src="${escHTML(m[1])}" alt="" loading="lazy" /></figure><p>`;
            return escHTML(line);
          }).join("<br />");
          return `<p>${inner}</p>`
            .replace(/<p><\/p>/g, "")
            .replace(/<br \/>(<\/p>|<figure)/g, "$1")
            .replace(/(<\/figure>)<br \/>/g, "$1");
        })
        .join("");

      page.innerHTML = `
        <article class="note-article">
          ${note.coverImage
            ? `<div class="note-article__cover"><img src="${escHTML(note.coverImage)}" alt="" /></div>`
            : ""}
          <header class="note-article__header">
            <p class="note-article__eyebrow">
              <a href="market-notes.html">← Inbox</a>
              ${dateStr ? `<span>${escHTML(dateStr)}</span>` : ""}
            </p>
            <h1 class="note-article__title">${escHTML(note.title)}</h1>
            ${note.subtitle ? `<p class="note-article__subtitle">${escHTML(note.subtitle)}</p>` : ""}
          </header>
          <div class="note-article__body">${bodyHTML || "<p>—</p>"}</div>
        </article>
      `;
    })();
  </script>
  <script src="shell.js"></script>
</body>
</html>
