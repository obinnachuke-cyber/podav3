<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Poda Capital — Closet OS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <!-- Login screen: shown until the admin signs in. The admin app below
       stays hidden (and never loads data) until authentication succeeds. -->
  <div class="login-gate" id="loginGate" hidden>
    <form class="login-card" id="loginForm">
      <h1 class="login-title">Poda Capital</h1>
      <p class="login-sub">Admin sign in</p>
      <label class="field field--full">
        <span>Password</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required autofocus />
      </label>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn btn--primary" id="loginBtn">Sign in</button>
    </form>
  </div>

  <!-- Admin app: revealed only after a successful login. -->
  <div class="admin-app" id="adminApp" hidden>
    <header class="site-header">
      <a class="site-logo" href="index.html">Poda Capital</a>
      <nav class="site-nav" aria-label="Admin">
        <a class="admin-public-link" href="index.html">← Public Site</a>
        <button type="button" class="admin-newitem" id="importBtn">Import from this browser</button>
        <button type="button" class="admin-newitem" id="exportExcelBtn">Download Excel</button>
        <button type="button" class="admin-newitem" id="backupBtn">Backup (JSON)</button>
        <button type="button" class="admin-newitem" id="restoreBtn">Restore</button>
        <input type="file" id="restoreInput" accept="application/json,.json" hidden />
        <button type="button" class="admin-newitem" id="headerNewItem">+ New Item</button>
        <button type="button" class="admin-newitem" id="headerNewNote">+ New Note</button>
        <button type="button" class="admin-public-link" id="logoutBtn">Log out</button>
      </nav>
    </header>

    <div class="admin-shell">
      <aside class="admin-sidebar">
        <nav class="admin-nav" aria-label="Admin views">
          <button type="button" class="admin-nav__link active" data-view="dashboard">Dashboard</button>
          <button type="button" class="admin-nav__link" data-view="all">All Items</button>
          <button type="button" class="admin-nav__link" data-view="closet">Closet</button>
          <button type="button" class="admin-nav__link" data-view="listed">Listed</button>
          <button type="button" class="admin-nav__link" data-view="sold">Sold</button>
          <hr style="border:none;border-top:1px solid var(--border);margin:8px 0;" />
          <button type="button" class="admin-nav__link" data-view="notes">Market Notes</button>
        </nav>
      </aside>

      <main class="admin-main" id="adminMain" aria-live="polite"></main>
    </div>

    <!-- Item create/edit modal -->
    <div class="modal-overlay" id="modalOverlay" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Item editor">
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <!-- ExcelJS: builds the downloadable inventory workbook in the browser. -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="excel-export.js"></script>
  <script src="admin.js"></script>
</body>
</html>
