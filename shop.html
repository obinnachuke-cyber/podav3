<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#244CFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="poda" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop — poda</title>
  <meta name="description" content="Shop is poda's current drop — a narrow, deliberate selection of pieces from invited sellers, brands, boutiques and private closets." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="site-header__inner"></div>
  </header>

  <main class="portal-shell">
    <!-- Filled in by folders.js: the release currently in Shop, plus a quiet
         notice of the next drop. Products come from the database only. -->
    <div id="shopPage" aria-live="polite">
      <p class="status-message">Opening Shop…</p>
    </div>
  </main>

  <footer class="site-footer portal-shell"></footer>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="marketplace-db.js"></script>
  <script src="tz.js"></script>
  <script src="folders.js"></script>
  <script src="subscribe.js"></script>
  <script src="layout.js"></script>
</body>
</html>
